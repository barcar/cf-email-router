name = "cf-email-router"
main = "worker.js"
compatibility_date = "2025-07-13"

# Optional: enable if a dependency needs Node built-ins (uncomment if `wrangler deploy` fails).
# compatibility_flags = [ "nodejs_compat" ]

# Secrets (set with `wrangler secret put <NAME>`):
#   EMAIL_ROUTES — required. JSON array of routes; first match wins.
#     Each object: to (string | string[]) — exact address match, not regex; only "*" is catch-all,
#     optional from (string | string[]),
#     optional discordWebhookUrl (or webhook) as JSON array of URLs, optional forwardTo as JSON array — use ["x"] for one item; at least one side required per route.
#
# Optional plain vars (non-secret), e.g. under [vars]:
#   DISCORD_FILE_LIMIT_BYTES — default 8000000 (8MB); raise for boosted Discord servers

# [observability.logs]
# enabled = true
